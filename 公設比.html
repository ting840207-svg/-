<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公設比計算機</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1208;
    --paper: #f5f0e8;
    --cream: #ede8dc;
    --accent: #c8502a;
    --accent-light: #e8846a;
    --muted: #8a7d6b;
    --border: #d4c9b5;
    --green: #3a6b45;
    --red: #c8502a;
  }

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
font-family: ‘Noto Serif TC’, serif;
background: var(–paper);
color: var(–ink);
min-height: 100vh;
background-image:
radial-gradient(ellipse at 20% 10%, rgba(200,80,42,0.06) 0%, transparent 50%),
radial-gradient(ellipse at 80% 90%, rgba(58,107,69,0.06) 0%, transparent 50%);
}

/* Grain texture */
body::before {
content: ‘’;
position: fixed;
inset: 0;
background-image: url(“data:image/svg+xml,%3Csvg viewBox=‘0 0 256 256’ xmlns=‘http://www.w3.org/2000/svg’%3E%3Cfilter id=‘noise’%3E%3CfeTurbulence type=‘fractalNoise’ baseFrequency=‘0.9’ numOctaves=‘4’ stitchTiles=‘stitch’/%3E%3C/filter%3E%3Crect width=‘100%25’ height=‘100%25’ filter=‘url(%23noise)’ opacity=‘0.03’/%3E%3C/svg%3E”);
pointer-events: none;
z-index: 999;
opacity: 0.4;
}

.page-wrap {
max-width: 760px;
margin: 0 auto;
padding: 48px 24px 80px;
}

/* Header */
header {
text-align: center;
margin-bottom: 52px;
position: relative;
}

.header-rule {
width: 48px;
height: 3px;
background: var(–accent);
margin: 0 auto 20px;
}

header h1 {
font-size: clamp(2rem, 5vw, 3rem);
font-weight: 700;
letter-spacing: -0.02em;
line-height: 1.1;
}

header h1 span {
color: var(–accent);
}

header p {
margin-top: 12px;
color: var(–muted);
font-size: 0.9rem;
font-weight: 300;
letter-spacing: 0.04em;
}

/* Card */
.card {
background: white;
border: 1px solid var(–border);
border-radius: 2px;
padding: 36px 40px;
margin-bottom: 20px;
box-shadow: 0 2px 12px rgba(0,0,0,0.04), 4px 4px 0 var(–cream);
animation: fadeUp 0.5s ease both;
}

.card:nth-child(2) { animation-delay: 0.1s; }
.card:nth-child(3) { animation-delay: 0.2s; }

@keyframes fadeUp {
from { opacity: 0; transform: translateY(16px); }
to   { opacity: 1; transform: translateY(0); }
}

.card-title {
font-size: 0.7rem;
font-family: ‘DM Mono’, monospace;
letter-spacing: 0.15em;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 24px;
display: flex;
align-items: center;
gap: 10px;
}

.card-title::after {
content: ‘’;
flex: 1;
height: 1px;
background: var(–border);
}

/* Input grid */
.input-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 20px;
}

@media (max-width: 520px) {
.input-grid { grid-template-columns: 1fr; }
.card { padding: 24px 20px; }
}

.field {
display: flex;
flex-direction: column;
gap: 8px;
}

.field.full { grid-column: 1 / -1; }

label {
font-size: 0.82rem;
font-weight: 600;
color: var(–ink);
letter-spacing: 0.01em;
}

label .sub {
font-weight: 300;
color: var(–muted);
font-size: 0.75rem;
margin-left: 4px;
}

.input-wrap {
position: relative;
}

input[type=“number”] {
width: 100%;
padding: 12px 44px 12px 14px;
font-family: ‘DM Mono’, monospace;
font-size: 1rem;
border: 1.5px solid var(–border);
border-radius: 2px;
background: var(–paper);
color: var(–ink);
transition: border-color 0.2s, background 0.2s;
-moz-appearance: textfield;
appearance: textfield;
}

input[type=“number”]::-webkit-inner-spin-button,
input[type=“number”]::-webkit-outer-spin-button { -webkit-appearance: none; }

input[type=“number”]:focus {
outline: none;
border-color: var(–accent);
background: white;
}

.unit {
position: absolute;
right: 14px;
top: 50%;
transform: translateY(-50%);
font-size: 0.78rem;
color: var(–muted);
font-family: ‘DM Mono’, monospace;
pointer-events: none;
}

/* Hint pills */
.hints {
display: flex;
gap: 6px;
flex-wrap: wrap;
margin-top: 6px;
}

.hint-pill {
font-size: 0.72rem;
font-family: ‘DM Mono’, monospace;
padding: 3px 9px;
border: 1px solid var(–border);
border-radius: 20px;
color: var(–muted);
cursor: pointer;
transition: all 0.15s;
background: transparent;
font-family: ‘Noto Serif TC’, serif;
}

.hint-pill:hover {
border-color: var(–accent);
color: var(–accent);
background: rgba(200,80,42,0.04);
}

/* Calculate button */
.btn-calc {
width: 100%;
margin-top: 28px;
padding: 16px;
background: var(–ink);
color: var(–paper);
border: none;
font-family: ‘Noto Serif TC’, serif;
font-size: 1rem;
font-weight: 600;
letter-spacing: 0.08em;
cursor: pointer;
border-radius: 2px;
transition: background 0.2s, transform 0.1s;
position: relative;
overflow: hidden;
}

.btn-calc::after {
content: ‘’;
position: absolute;
inset: 0;
background: var(–accent);
transform: scaleX(0);
transform-origin: left;
transition: transform 0.3s ease;
z-index: 0;
}

.btn-calc:hover::after { transform: scaleX(1); }
.btn-calc span { position: relative; z-index: 1; }
.btn-calc:active { transform: scale(0.99); }

/* Result */
#result {
display: none;
animation: fadeUp 0.4s ease;
}

.result-hero {
text-align: center;
padding: 28px 0 20px;
border-bottom: 1px solid var(–border);
margin-bottom: 24px;
}

.result-label {
font-size: 0.7rem;
font-family: ‘DM Mono’, monospace;
letter-spacing: 0.15em;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 8px;
}

.result-number {
font-size: 4rem;
font-weight: 700;
letter-spacing: -0.03em;
line-height: 1;
transition: color 0.3s;
}

.result-number.low  { color: var(–green); }
.result-number.mid  { color: var(–accent); }
.result-number.high { color: var(–red); }

.result-verdict {
margin-top: 10px;
font-size: 0.88rem;
color: var(–muted);
}

.result-verdict strong {
font-weight: 600;
}

/* Breakdown table */
.breakdown {
display: grid;
gap: 10px;
}

.breakdown-row {
display: flex;
justify-content: space-between;
align-items: baseline;
padding: 10px 0;
border-bottom: 1px dashed var(–border);
}

.breakdown-row:last-child { border-bottom: none; }

.brow-label { font-size: 0.88rem; color: var(–muted); }
.brow-value {
font-family: ‘DM Mono’, monospace;
font-size: 0.95rem;
font-weight: 500;
color: var(–ink);
}

/* Range bar */
.range-section {
margin-top: 20px;
padding-top: 20px;
border-top: 1px solid var(–border);
}

.range-title {
font-size: 0.75rem;
color: var(–muted);
margin-bottom: 12px;
letter-spacing: 0.05em;
}

.range-bar-wrap {
position: relative;
height: 8px;
background: var(–cream);
border-radius: 4px;
overflow: hidden;
}

.range-bar-fill {
height: 100%;
border-radius: 4px;
transition: width 0.6s cubic-bezier(0.16,1,0.3,1), background 0.3s;
}

.range-labels {
display: flex;
justify-content: space-between;
margin-top: 6px;
font-size: 0.68rem;
font-family: ‘DM Mono’, monospace;
color: var(–muted);
}

/* Tips */
.tips-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
gap: 14px;
}

.tip-item {
background: var(–paper);
border: 1px solid var(–border);
border-radius: 2px;
padding: 14px 16px;
}

.tip-range {
font-family: ‘DM Mono’, monospace;
font-size: 0.8rem;
font-weight: 500;
margin-bottom: 5px;
}

.tip-range.low  { color: var(–green); }
.tip-range.mid  { color: var(–accent); }
.tip-range.high { color: var(–red); }

.tip-desc {
font-size: 0.78rem;
color: var(–muted);
line-height: 1.5;
}

/* Reset */
.btn-reset {
display: block;
margin: 16px auto 0;
background: none;
border: 1px solid var(–border);
font-family: ‘Noto Serif TC’, serif;
font-size: 0.82rem;
color: var(–muted);
padding: 8px 20px;
cursor: pointer;
border-radius: 2px;
transition: all 0.2s;
}

.btn-reset:hover {
border-color: var(–ink);
color: var(–ink);
}

footer {
text-align: center;
margin-top: 48px;
font-size: 0.75rem;
color: var(–border);
font-family: ‘DM Mono’, monospace;
letter-spacing: 0.05em;
}
</style>

</head>
<body>
<div class="page-wrap">

  <header>
    <div class="header-rule"></div>
    <h1>公設比<span>計算機</span></h1>
    <p>輸入登記坪數與權狀坪數，立即算出公設比與實際室內空間</p>
  </header>

  <!-- 輸入區 -->

  <div class="card">
    <div class="card-title">基本資料輸入</div>

```
<div class="input-grid">

  <div class="field">
    <label>登記總坪數 <span class="sub">（權狀坪數）</span></label>
    <div class="input-wrap">
      <input type="number" id="total" placeholder="0.00" min="0" step="0.01">
      <span class="unit">坪</span>
    </div>
    <div class="hints">
      <span class="hint-pill" onclick="setVal('total',30)">30坪</span>
      <span class="hint-pill" onclick="setVal('total',45)">45坪</span>
      <span class="hint-pill" onclick="setVal('total',60)">60坪</span>
    </div>
  </div>

  <div class="field">
    <label>主建物坪數 <span class="sub">（室內實坪）</span></label>
    <div class="input-wrap">
      <input type="number" id="main" placeholder="0.00" min="0" step="0.01">
      <span class="unit">坪</span>
    </div>
    <div class="hints">
      <span class="hint-pill" onclick="setVal('main',20)">20坪</span>
      <span class="hint-pill" onclick="setVal('main',28)">28坪</span>
      <span class="hint-pill" onclick="setVal('main',38)">38坪</span>
    </div>
  </div>

  <div class="field">
    <label>附屬建物 <span class="sub">（陽台、雨遮等）</span></label>
    <div class="input-wrap">
      <input type="number" id="ancillary" placeholder="0.00" min="0" step="0.01">
      <span class="unit">坪</span>
    </div>
  </div>

  <div class="field">
    <label>車位坪數 <span class="sub">（若有，可填入）</span></label>
    <div class="input-wrap">
      <input type="number" id="parking" placeholder="0.00" min="0" step="0.01">
      <span class="unit">坪</span>
    </div>
  </div>

  <div class="field full">
    <label>房屋總價 <span class="sub">（選填，計算每坪單價）</span></label>
    <div class="input-wrap">
      <input type="number" id="price" placeholder="0" min="0" step="1">
      <span class="unit">萬元</span>
    </div>
  </div>

</div>

<button class="btn-calc" onclick="calculate()">
  <span>立即計算 →</span>
</button>
```

  </div>

  <!-- 結果區 -->

  <div class="card" id="result">
    <div class="card-title">計算結果</div>

```
<div class="result-hero">
  <div class="result-label">公設比</div>
  <div class="result-number" id="ratio-display">—</div>
  <div class="result-verdict" id="verdict"></div>
</div>

<div class="breakdown" id="breakdown"></div>

<div class="range-section">
  <div class="range-title">公設比區間參考（台灣一般行情）</div>
  <div class="range-bar-wrap">
    <div class="range-bar-fill" id="range-fill"></div>
  </div>
  <div class="range-labels">
    <span>0%</span>
    <span>▲ 優良 20%</span>
    <span>▲ 合理 32%</span>
    <span>50%</span>
  </div>
</div>

<button class="btn-reset" onclick="resetForm()">重新計算</button>
```

  </div>

  <!-- 說明區 -->

  <div class="card">
    <div class="card-title">公設比快速指引</div>
    <div class="tips-grid">
      <div class="tip-item">
        <div class="tip-range low">＜ 20%</div>
        <div class="tip-desc">低公設，室內坪效高，多見於老公寓或透天厝。</div>
      </div>
      <div class="tip-item">
        <div class="tip-range low">20 – 28%</div>
        <div class="tip-desc">合理偏低，大樓設施適中，CP值佳。</div>
      </div>
      <div class="tip-item">
        <div class="tip-range mid">28 – 35%</div>
        <div class="tip-desc">台灣新建大樓常見區間，需確認公設品質。</div>
      </div>
      <div class="tip-item">
        <div class="tip-range high">＞ 35%</div>
        <div class="tip-desc">高公設，通常含豐富設施；注意實際使用率。</div>
      </div>
    </div>
  </div>

  <footer>© 2026 公設比計算機 · 僅供參考，實際以謄本登記為準</footer>

</div>

<script>
  function setVal(id, val) {
    document.getElementById(id).value = val;
  }

  function calculate() {
    const total    = parseFloat(document.getElementById('total').value)    || 0;
    const main     = parseFloat(document.getElementById('main').value)     || 0;
    const ancil    = parseFloat(document.getElementById('ancillary').value)|| 0;
    const parking  = parseFloat(document.getElementById('parking').value)  || 0;
    const price    = parseFloat(document.getElementById('price').value)    || 0;

    if (total <= 0 || main <= 0) {
      alert('請至少填入「登記總坪數」與「主建物坪數」');
      return;
    }

    // 扣除車位後計算公設比
    const effectiveTotal = total - parking;
    const publicArea = effectiveTotal - main - ancil;
    const ratio = (publicArea / effectiveTotal) * 100;

    // Display
    const resultEl = document.getElementById('result');
    const ratioEl  = document.getElementById('ratio-display');
    const verdictEl= document.getElementById('verdict');
    const breakdownEl = document.getElementById('breakdown');
    const fillEl   = document.getElementById('range-fill');

    resultEl.style.display = 'block';
    resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

    // Colour coding
    ratioEl.textContent = ratio.toFixed(2) + '%';
    ratioEl.className = 'result-number';
    let verdictText = '';
    if (ratio < 20) {
      ratioEl.classList.add('low');
      verdictText = '🟢 <strong>低公設</strong>，室內坪效優秀';
    } else if (ratio < 28) {
      ratioEl.classList.add('low');
      verdictText = '🟢 <strong>合理偏低</strong>，公設比良好';
    } else if (ratio < 35) {
      ratioEl.classList.add('mid');
      verdictText = '🟡 <strong>合理區間</strong>，屬台灣主流水準';
    } else {
      ratioEl.classList.add('high');
      verdictText = '🔴 <strong>偏高</strong>，請確認公設實際使用價值';
    }
    verdictEl.innerHTML = verdictText;

    // Range fill (cap at 50%)
    const fillPct = Math.min(ratio / 50 * 100, 100);
    fillEl.style.width = fillPct + '%';
    fillEl.style.background = ratio < 28
      ? 'var(--green)'
      : ratio < 35
        ? 'var(--accent)'
        : 'var(--red)';

    // Breakdown rows
    const rows = [
      ['登記總坪數（含車位）', total.toFixed(2) + ' 坪'],
      ['車位坪數', parking > 0 ? parking.toFixed(2) + ' 坪' : '—'],
      ['扣除車位後有效坪數', effectiveTotal.toFixed(2) + ' 坪'],
      ['主建物（室內實坪）', main.toFixed(2) + ' 坪'],
      ['附屬建物（陽台等）', ancil > 0 ? ancil.toFixed(2) + ' 坪' : '—'],
      ['公共設施坪數', publicArea.toFixed(2) + ' 坪'],
      ['公設比', ratio.toFixed(2) + ' %'],
    ];

    if (price > 0) {
      const pricePerTotal = price / total;
      const pricePerMain  = price / main;
      rows.push(['每登記坪單價', pricePerTotal.toFixed(1) + ' 萬/坪']);
      rows.push(['每實坪單價', pricePerMain.toFixed(1) + ' 萬/坪']);
    }

    breakdownEl.innerHTML = rows.map(([label, value]) => `
      <div class="breakdown-row">
        <span class="brow-label">${label}</span>
        <span class="brow-value">${value}</span>
      </div>
    `).join('');
  }

  function resetForm() {
    ['total','main','ancillary','parking','price'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('result').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

</body>
</html>
